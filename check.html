<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClassPulse 接続確認</title>
<style>
  :root {
    --main: #3F63F6;
    --navy: #1F2A6B;
    --accent: #45D0C2;
    --ok: #52C97A;
    --warn: #F4C94A;
    --danger: #E8576A;
    --purple: #A88CF6;
    --bg: #F6F8FF;
    --card: #FFFFFF;
    --line: #DCE4F5;
    --r1: 12px; --r2: 16px; --r3: 24px;
    --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--navy);
    font-family: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    font-size: 16px;
    line-height: 1.7;
  }
  main { max-width: 720px; margin: 0 auto; padding: var(--s3) var(--s2) var(--s4); }
  h1 { font-size: 40px; margin: 0 0 var(--s1); line-height: 1.3; }
  h2 { font-size: 28px; margin: var(--s3) 0 var(--s1); }
  p { margin: 0 0 var(--s2); }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r2);
    padding: var(--s2) var(--s3);
    margin-bottom: var(--s2);
  }
  button {
    min-width: 44px; min-height: 44px;
    padding: var(--s1) var(--s3);
    font: inherit; font-weight: 700;
    color: #FFFFFF; background: var(--main);
    border: 0; border-radius: var(--r1);
    cursor: pointer;
  }
  button:disabled { background: var(--navy); opacity: .6; cursor: default; }
  ol { list-style: none; margin: 0; padding: 0; }
  li {
    min-height: 44px;
    padding: var(--s1) 0;
    border-bottom: 1px solid var(--line);
  }
  li:last-child { border-bottom: 0; }
  .name { font-weight: 700; }
  .result { display: block; }
  .ok { color: #1E7A45; font-weight: 700; }
  .ng { color: #B3243A; font-weight: 700; }
  .wait { color: var(--navy); }
  .note { font-size: 12px; }
  #summary { font-weight: 700; }
  #ua { font-size: 12px; word-break: break-all; }
  .warn { border-left: 8px solid var(--danger); }
</style>
</head>
<body>
<main>
  <h1>ClassPulse 接続確認</h1>
  <p>この端末とネットワークで、ClassPulse に必要な通信ができるかを確かめます。</p>

  <div class="card warn" id="config-error" hidden>
    <p id="config-error-text"></p>
  </div>

  <div class="card" id="panel">
    <button type="button" id="start">確認を始める</button>
    <h2>確認の結果</h2>
    <ol id="list"></ol>
    <p id="summary"></p>
    <p id="ua"></p>
  </div>
</main>

<script type="module">
import { FIREBASE } from './js/firebase-config.js';

const TIMEOUT_MS = 10000;
const $ = (id) => document.getElementById(id);

const CHECKS = [
  '1. データベースを読む',
  '2. 匿名でログインする',
  '3. データベースに書く',
  '4. 変化を受け取る',
  '5. ログインを更新する',
];

// 各項目の行を作る（文字は textContent で入れる）
const rows = CHECKS.map((label) => {
  const li = document.createElement('li');
  const name = document.createElement('span');
  name.className = 'name';
  name.textContent = label;
  const result = document.createElement('span');
  result.className = 'result wait';
  result.textContent = '－ まだ確認していません';
  li.append(name, result);
  $('list').append(li);
  return result;
});

function setResult(i, ok, text) {
  rows[i].className = 'result ' + (ok ? 'ok' : 'ng');
  rows[i].textContent = ok ? '○ できました' : '× できませんでした（' + text + '）';
}

function setWaiting(i) {
  rows[i].className = 'result wait';
  rows[i].textContent = '… 確認しています';
}

// 理由を短い文にする
function reason(e) {
  if (e && e.name === 'AbortError') return '10 秒たっても返事がありませんでした';
  if (e && e.message) return e.message;
  return '原因がわかりません';
}

// 10 秒で打ち切る fetch
async function timedFetch(url, options) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try {
    return await fetch(url, { ...options, signal: ctrl.signal });
  } finally {
    clearTimeout(timer);
  }
}

async function readError(res) {
  let detail = '';
  try {
    const body = await res.json();
    detail = body && body.error
      ? (typeof body.error === 'string' ? body.error : (body.error.message || ''))
      : '';
  } catch (_) { /* 本文が読めなくてもよい */ }
  return '応答コード ' + res.status + (detail ? '、' + detail : '');
}

async function putNumber(base, uid, token) {
  const res = await timedFetch(
    base + '/check/' + encodeURIComponent(uid) + '.json?auth=' + encodeURIComponent(token),
    { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Date.now()) }
  );
  if (!res.ok) throw new Error(await readError(res));
}

// 変化を受け取る: EventSource を開き、書きこんで、put イベントを待つ。10 秒で打ち切り、必ず閉じる
function watchAndWrite(base, uid, token) {
  return new Promise((resolve, reject) => {
    const url = base + '/check/' + encodeURIComponent(uid) + '.json?auth=' + encodeURIComponent(token);
    let es = null;
    let done = false;
    let wrote = false;
    const finish = (err) => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      if (es) es.close();
      if (err) reject(err); else resolve();
    };
    const timer = setTimeout(() => finish(new Error('10 秒たっても変化が届きませんでした')), TIMEOUT_MS);
    try {
      es = new EventSource(url);
    } catch (e) {
      finish(e);
      return;
    }
    let putCount = 0;
    es.addEventListener('put', () => {
      putCount += 1;
      // 1 回目は開いた直後の今の値。書きこみのあとに届く 2 回目（以降）で成功とする
      if (!wrote) {
        wrote = true;
        putNumber(base, uid, token).catch((e) => finish(e));
      } else {
        finish();
      }
    });
    es.addEventListener('cancel', () => finish(new Error('データベースが接続を取り消しました')));
    es.onerror = () => {
      // 接続できないとき、ブラウザは自動でやり直す。10 秒で打ち切るのでここでは待つ
      if (es && es.readyState === 2) finish(new Error('変化を受け取る接続ができませんでした'));
    };
  });
}

async function run() {
  const base = FIREBASE.databaseURL.replace(/\/+$/, '');
  const key = FIREBASE.apiKey;
  const results = [false, false, false, false, false];
  let uid = '';
  let idToken = '';
  let refreshToken = '';

  async function step(i, fn) {
    setWaiting(i);
    try {
      await fn();
      setResult(i, true);
      results[i] = true;
    } catch (e) {
      setResult(i, false, reason(e));
    }
  }

  await step(0, async () => {
    const res = await timedFetch(base + '/check/ping.json');
    if (!res.ok) throw new Error(await readError(res));
  });

  await step(1, async () => {
    const res = await timedFetch(
      'https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + encodeURIComponent(key),
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ returnSecureToken: true }) }
    );
    if (!res.ok) throw new Error(await readError(res));
    const data = await res.json();
    uid = data.localId;
    idToken = data.idToken;
    refreshToken = data.refreshToken;
    if (!uid || !idToken) throw new Error('ログインの返事が正しくありません');
  });

  await step(2, async () => {
    if (!idToken) throw new Error('2 のログインができていないため、確認できません');
    await putNumber(base, uid, idToken);
  });

  await step(3, async () => {
    if (!idToken) throw new Error('2 のログインができていないため、確認できません');
    await watchAndWrite(base, uid, idToken);
  });

  await step(4, async () => {
    if (!refreshToken) throw new Error('2 のログインができていないため、確認できません');
    const res = await timedFetch(
      'https://securetoken.googleapis.com/v1/token?key=' + encodeURIComponent(key),
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(refreshToken),
      }
    );
    if (!res.ok) throw new Error(await readError(res));
  });

  const allOk = results.every(Boolean);
  const summary = $('summary');
  summary.className = allOk ? 'ok' : 'ng';
  summary.textContent = allOk
    ? '5 つすべて ○ でした。このネットワークで ClassPulse を使えます。'
    : '× がありました。どの項目が × だったかを、Claude Code に伝えてください。';
  $('ua').textContent = '端末の種類：' + navigator.userAgent;
}

if (!FIREBASE.databaseURL || !FIREBASE.apiKey) {
  $('config-error').hidden = false;
  $('config-error-text').textContent =
    '× 設定がまだありません。js/firebase-config.js に、データベースの URL と Web API キーを入れてから開き直してください。';
  $('start').disabled = true;
} else {
  $('start').addEventListener('click', async () => {
    $('start').disabled = true;
    $('summary').textContent = '';
    try {
      await run();
    } finally {
      $('start').disabled = false;
      $('start').textContent = 'もう一度確認する';
    }
  });
}
</script>
</body>
</html>
